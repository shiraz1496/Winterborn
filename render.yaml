# render.yaml -- Render Blueprint for apps/api's three processes
# (spec §4.3/§4.4): a web service (REST API + Square webhook receiver), a
# background worker (drains SquareInboxEvent), and a cron job (the
# reconciliation poll, every 20 minutes). All three build from the SAME
# image (apps/api/Dockerfile, built with this repo root as context) and
# differ only in `dockerCommand` -- do not give them separate Dockerfiles.
#
# Region: Ohio -- Render's US-East region (there is no region literally
# named "us-east"; "ohio" is it). Matches spec §4.4's US-East requirement
# for Square/client latency.
#
# THIS FILE IS NOT DEPLOYED BY ANYONE ON THIS TASK. Task 3 of
# docs/superpowers/plans/2026-08-21-thresholds-and-deploy.md is
# configuration and documentation only -- no Render account was created,
# nothing here has been applied. See docs/DEPLOY.md for the actual
# cutover steps and, importantly, which of the envVars below marked
# `sync: false` are owner-gated (only Joel can produce the value) versus
# ones the deploying engineer can fill in themselves.
#
# Database note: this blueprint declares a Render-managed Postgres
# instance below so the file is self-contained and stands up a working
# environment on its own (e.g. for a staging rehearsal). Spec §4.4's own
# recommendation for PRODUCTION is Neon instead, specifically for its
# branching feature (fork prod data to rehearse a ledger replay or a
# destructive migration, then discard the branch) and point-in-time
# recovery. Per spec §4.5, moving between them is an environment-variable
# change, not a code change: point DATABASE_URL at the Neon connection
# string instead of `fromDatabase` below and remove the `databases:`
# block. docs/DEPLOY.md spells out the cutover order.

services:
  - type: web
    name: winterborn-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    region: ohio
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase: { name: winterborn-postgres, property: connectionString }
      - key: WEB_ORIGIN
        sync: false # the Vercel production URL for apps/web -- see docs/DEPLOY.md
      - key: JWT_SECRET
        generateValue: true # Render generates and stores this; nobody needs to know the value
      - key: SQUARE_ENV
        value: production
      - key: SQUARE_APPLICATION_ID
        sync: false # OWNER-GATED -- see docs/DEPLOY.md
      - key: SQUARE_ACCESS_TOKEN
        sync: false # OWNER-GATED -- see docs/DEPLOY.md
      - key: SQUARE_WEBHOOK_SIGNATURE_KEY
        sync: false # set AFTER first deploy, once this service's public URL exists -- see docs/DEPLOY.md
      - key: SQUARE_WEBHOOK_NOTIFICATION_URL
        sync: false # https://<this-service>.onrender.com/square/webhook -- must byte-for-byte match what's registered with Square (webhook.controller.ts signs against it)

  - type: worker
    name: winterborn-inbox-worker
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    dockerCommand: node apps/api/dist/cli/drain-inbox.js
    region: ohio
    plan: starter
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase: { name: winterborn-postgres, property: connectionString }
      - key: SQUARE_ENV
        value: production
      - key: SQUARE_ACCESS_TOKEN
        sync: false # OWNER-GATED -- same token as winterborn-api, see docs/DEPLOY.md
      - key: INBOX_DRAIN_INTERVAL_MS
        value: 10000

  - type: cron
    name: winterborn-reconciliation-poll
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    dockerCommand: node apps/api/dist/cli/poll-orders.js
    schedule: '*/20 * * * *' # spec §7.2 / §9.6 -- every 20 minutes, the self-heal window for a dropped webhook
    region: ohio
    plan: starter
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase: { name: winterborn-postgres, property: connectionString }
      - key: SQUARE_ENV
        value: production
      - key: SQUARE_ACCESS_TOKEN
        sync: false # OWNER-GATED -- same token as winterborn-api, see docs/DEPLOY.md

databases:
  - name: winterborn-postgres
    region: ohio
    plan: starter
    databaseName: winterborn
    user: winterborn
